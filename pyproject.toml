[project]
name = "ecomap"
dynamic = ["version"]
authors = [
  {name="Hua Xu", email="huax666@uw.edu"},
  {name="Yiyang Ge", email="yg287@uw.edu"},
  {name="Jessie Wei", email="jessiw31@uw.edu"},
  {name="Wenjun Dang", email="dangwj@uw.edu"}
